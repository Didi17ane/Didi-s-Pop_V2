name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    name: Analyse statique et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Installer les dépendances
        run: flutter pub get

      - name: Générer les fichiers de localisation
        run: flutter gen-l10n

      - name: Vérifier le formatage
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyse statique (flutter analyze)
        run: flutter analyze --fatal-infos

      - name: Tests unitaires et widgets
        run: flutter test --coverage

      - name: Publier la couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info

  integration-tests:
    name: Tests d'intégration
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Installer les dépendances
        run: flutter pub get

      - name: Générer les fichiers de localisation
        run: flutter gen-l10n

      - name: Activer le support desktop Linux
        run: flutter config --enable-linux-desktop

      - name: Installer les dépendances système (GTK + écran virtuel)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb

      - name: Tests d'intégration
        run: xvfb-run -a flutter test integration_test -d linux